<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Animated Form</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Basic Styles */
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #282c34;
}

/* Form Styling */
.form-container {
    background-color: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    text-align: center;
    width: 400px;
   
}

#firstName{
    width: 300px;
    
}
#lastName{
    width: 300px;
}
#birthday{
    width: 300px;
}

form h2 {
    margin-bottom: 20px;
    color: #333;
}

input[type="text"],
input[type="date"] {
    padding: 10px;
    margin: 10px 0;
    width: 100%;
    border-radius: 5px;
    border: 2px solid #ccc;
    font-size: 16px;
    outline: none;
    transition: border-color 0.3s;
}

input[type="text"]:focus,
input[type="date"]:focus {
    border-color: #00c1ff;
}

button {
    padding: 10px 20px;
    background-color: #4a90e2;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
}

button:hover {
    background-color: #00c1ff;
}

/* Glowing Card Styling */


.card-content {
    text-align: center;
    color: white;
}

h1 {
    font-size: 40px;
    margin: 10px 0;
}

p {
    font-size: 20px;
    margin: 10px 0;
}


/* Glowing Effect */
@keyframes glow {
    0% {
        box-shadow: 0 0 10px #00c1ff, 0 0 20px #00c1ff, 0 0 30px #00c1ff;
    }
    100% {
        box-shadow: 0 0 20px #00ff00, 0 0 30px #00ff00, 0 0 40px #00ff00;
    }
}

/* Party Poppers Styling */
.party-poppers {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    gap: 20px;
}

.popper {
    width: 10px;
    height: 200px;
    background-color: transparent;
    position: relative;
    animation: popperExplosion 2s ease forwards;
    animation-delay: 0.5s;
}

.popper::before, .popper::after {
    content: "";
    position: absolute;
    background-color: #ff69b4;
    width: 100%;
    height: 50px;
    top: -50px;
    transform-origin: bottom;
    animation: confetti 1s ease forwards;
}

.popper::after {
    background-color: #ff4500;
    animation-delay: 0.2s;
}

@keyframes confetti {
    0% { 
        transform: scale(1); 
    }
    100% { 
        transform: scale(0) rotate(180deg); 
    }
}

@keyframes popperExplosion {
    0% { 
        transform: scale(0.1); 
        opacity: 0;
    }
    50% { 
        transform: scale(1.2); 
        opacity: 1;
    }
    100% { 
        transform: scale(1); 
    }
}

/* Glowing Effect */
/* Glowing Effect */
@keyframes glow {
    0% {
        box-shadow: 0 0 10px blue, 0 0 20px rgb(1, 226, 199), 0 0 30px yellow;
    }
    50% {
        box-shadow: 0 0 20px green, 0 0 30px red, 0 0 40px orange;
    }
    100% {
        box-shadow: 0 0 30px rgb(14, 187, 179), 0 0 40px blue, 0 0 50px yellow;
    }
}

/* Glowing Card Styling */
.card {
    width: 600px; 
    height: 400px; 
    background: linear-gradient(45deg, blue, rgb(8, 238, 207), yellow, green, red, orange);
    background-size: 200% 200%;
    border-radius: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: glow 0.8s infinite alternate, colorChange 3s infinite; /* Faster glow and color change */
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* New Animation for Gradient Background */
@keyframes colorChange {
    0% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
    100% {
        background-position: 0% 50%;
    }
}

#rennel-pic {
    width: 300px;
    height: 220px;
    border: solid 5px rgb(255, 166, 0); /* Specify the thickness and color of the border */
    border-radius: 10px;
    box-shadow: 
        0 0 15px rgb(231, 77, 6),  /* Increased blur */
        0 0 15px rgb(255, 242, 0), /* Increased blur */
        0 0 15px rgb(255, 111, 0);  /* Increased blur */
    transition: box-shadow 0.3s ease; /* Smooth transition for glow effect */
}

/* Optional: Add a hover effect for interaction */
#rennel-pic:hover {
    box-shadow: 
        0 0 40px rgb(6, 6, 231), /* Increased blur on hover */
        0 0 40px rgb(251, 255, 0), /* Increased blur on hover */
        0 0 40px rgb(255, 157, 0);  /* Increased blur on hover */
}

#container-19{
    display: flex;
    justify-content: center;
}
.turns-19 {
    color: rgb(255, 255, 255);
    background-color: orangered;
    border: solid 4px orangered; /* Specify the thickness and color of the border */
    border-radius: 10px;
    width: 300px;
    box-shadow: 
        0 0 10px orangered,   /* Glow color and intensity */
        0 0 20px rgb(255, 255, 0), /* Yellow glow for effect */
        0 0 30px rgb(255, 0, 0);  /* Red glow for effect */
    transition: box-shadow 0.3s ease; /* Smooth transition for glow effect */
}

/* Optional: Add a hover effect for interaction */
.turns-19:hover {
    box-shadow: 
        0 0 20px orangered,  /* Increased glow on hover */
        0 0 30px rgb(255, 255, 0), /* Increased yellow glow on hover */
        0 0 40px rgb(255, 0, 0); /* Increased red glow on hover */
}

</style>
</head>
<body>
   
    <div class="form-container">
        <form id="userForm">
            <h2>Fill in Your Details</h2>
            <input type="text" id="firstName" placeholder="First Name" required><br>
            <input type="text" id="lastName" placeholder="Last Name" required><br>
            <input type="date" id="birthday" required><br>
            <button type="submit" id="submitBtn">Submit</button>
        </form>
    </div>

    <!-- Glowing Card Section -->
    <div class="card" id="card" style="display:none;">
        <div class="card-inner">
            <div class="card-content" id="cardContent">
                <h1>console.log, <span id="nameDisplay"></span>!</h1>
                <p>Birthday: <span id="birthdayDisplay"></span></p>
                <img src="rennel.jpg" alt="" id="rennel-pic">
                <div id="container-19">            
                <h2 class="turns-19">THIS GUY TURNS 19</h2>
            </div>
            </div>
        </div>
    </div>

    <!-- Party Poppers Section -->
    <div class="party-poppers" id="partyPoppers" style="display:none;">
        <div class="popper"></div>
        <div class="popper"></div>
        <div class="popper"></div>
        <div class="popper"></div>
    </div>

  
    <script>
      document.getElementById("userForm").addEventListener("submit", function(event) {
    event.preventDefault(); // Prevent page refresh on submit
    
    // Get input values
    const firstName = document.getElementById("firstName").value;
    const lastName = document.getElementById("lastName").value;
    const birthday = document.getElementById("birthday").value;
    
    // Display the card and inject values
    const card = document.getElementById("card");
    card.style.display = "block"; // Make the card visible

    const nameDisplay = document.getElementById("nameDisplay");
    const birthdayDisplay = document.getElementById("birthdayDisplay");
    
    // Update card content
    nameDisplay.textContent = `${firstName} ${lastName}`;
    birthdayDisplay.textContent = birthday;
    
    // Optionally hide the form after submission
    document.querySelector(".form-container").style.display = "none";
});

// Add event listener for the card click
document.getElementById("card").addEventListener("click", function() {
    const partyPoppers = document.getElementById("partyPoppers");
    partyPoppers.style.display = "flex"; // Show the party poppers when card is clicked
});

    </script>
</body>
</html>
