    <script>
         let message= "Good Evening";   //INCLUDE THE SPACES WHEN COUNTING
         lengthOfMessage = message.length;      
         console.log(lengthOfMessage); //12


         let greeting = "Good Evening" + "Goodnight";  
        let lengthOfGreeting = greeting.length;     
        console.log(lengthOfGreeting); //21


        let part1 = "Hello";
        let part2 = "World";
        let concatenated = part1 + " " + part2; //Hello World
        let concatenatedLength = concatenated.length;
        console.log(concatenatedLength);

    
        let strNum = "42";
        let convertedNum = Number(strNum);  //42 integer
        let strLengthBefore = strNum.length;  // 2
        let strLengthAfter = convertedNum.toString().length;   //42 to string with 2 length
        console.log(strLengthBefore); //2
        console.log(strLengthAfter);  //2



        let initialValue = 10;
        let statusMessage = "Count is: " + initialValue; //Count is 12
        initialValue++; //from 10 to 11 
        console.log(statusMessage);    // Count is: 10
        console.log(statusMessage.length); //12



        let startNumber = 8;
        let stringValue = "3";
        let multiplier = 2;
        stringValue = Number(stringValue);   //from "3" to 3  
        let finalValue = startNumber + stringValue; // 8 + 3 = 11
        finalValue *= multiplier; // 11 * 2 = 22
        console.log(finalValue);    // 22 
        console.log(typeof finalValue); //number


        let count = "Count This ";
        countLength = count.length;
        console.log(countLength);   //11
