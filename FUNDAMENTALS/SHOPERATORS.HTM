                //7 and its type is String

       //=================================================================//

//=======================SHORTHAND OPERATORS AND CHECKING=========================//

  //=======================SHORTHAND OPERATORS AND CHECKING=========================//

//====================Type Conversion and Arithmetic==============================//

        let varSix = 5;  
        let string = "10";
        let boolean = true;
        string = Number(string); // string to num  10 
        let resulttt = varSix + string; // 5 + 10  = 15
