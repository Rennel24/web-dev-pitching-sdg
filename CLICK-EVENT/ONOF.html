<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      
    <style>
        body {
            display: flex;
            border: solid;
            height: 100vh;
            justify-content: center;
            align-items: center;
            border: hidden;
        }

        #container{
            border: solid grey;
            width: 102px;
            height: 45px;
            border-radius: 100px;
            background-color: grey;
            
            
        }

        #switch {
            background-color: rgb(255, 255, 255);
            width: 51px;
            height: 40px; /* Ensure there is a semicolon here */
            cursor: pointer; /* Changes the cursor to a pointer */
            display: flex; /* Center the text inside the button */
            justify-content: center; /* Center text horizontally */
            align-items: center; /* Center text vertically */
            transition: ease 0.3s; /* Add a smooth transition */
            color: rgb(255, 255, 255);
            border-radius: 100px;
            margin: 0;
            margin-top: 2.0px;
           
        }
        .switch-two {
            
            transform: translateX(50px);
            color: aqua;
        }

        .bg-color{
            background-color: black;    
            
        }

        #indicator{
            margin-left: 14px;
            font-family: sans-serif;
            font-size: large;
            color: black;
        }
        .indicator{
            background-color: white;
        }

       
    </style>
</head>
<body id="bg-color">
        <div id="container">                                     
           <div id="switch" onclick="changePos()">.</div>
        </div> 
           <h2 id="indicator">ON/OFF</h2> 

    <script>
        const switches = document.getElementById("switch");
        const bodyColor = document.getElementById("bg-color");
        const text = document.getElementById("indicator");
        function changePos() {
            switches.classList.toggle("switch-two"); // Toggles the class
            bodyColor.classList.toggle("bg-color");
            bodyColor.style.transition = "ease 1s";
             
              
            if(text.textContent === 'ON/OFF'){
                     text.style.color = 'white';
                     text.textContent = 'ON';
                }else if(text.textContent === 'ON'){
                     text.textContent = 'OFF';
                     text.style.color = 'black';
                      
                     
                }else{
                    text.textContent = 'ON';  
                    text.style.color = 'white';

                }
             
               }
        

       
    </script>
</body>
</html>
