<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Images</title>
    <style>
        /* Basic styling for the page layout */
        body {
            margin: 0;
            background-color: rgba(234, 130, 191, 0.563);
        }

        #m-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 10px;
            position: relative;
        }

        /* Pink flower icons around the container */
        #m-container::before,
        #m-container::after {
            content: '🌸';
            font-size: 20px;
            color: pink;
            position: absolute;
            animation: float 5s infinite alternate;
        }

        /* Placing one flower icon above the container */
        #m-container::before {
            top: 10px;
            left: 20px;
        }

        /* Placing one flower icon below the container */
        #m-container::after {
            bottom: 10px;
            right: 20px;
        }

        /* Additional flower icons around the container */
        .flower {
            content: '🌸';
            font-size: 20px;
            color: pink;
            position: absolute;
        }
        .flower1 { top: 40px; left: 50px; }
        .flower2 { top: 80px; right: 50px; }
        .flower3 { bottom: 60px; left: 40px; }
        .flower4 { bottom: 90px; right: 20px; }
        .flower5 { top: 20px; right: 30%; } /* New flower */
        .flower6 { bottom: 10px; left: 30%; } /* New flower */
        .flower7 { top: 10%; left: 20%; } /* New flower */
        .flower8 { bottom: 20%; right: 25%; } /* New flower */

        @keyframes float {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }

        #container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            box-sizing: border-box;
            max-width: 100%;
            border: solid rgb(234, 69, 168);
            border-radius: 20px;
            width: 60%;
            height: 90%;
        }

        .color {
            background-color: rgb(241, 101, 197);
            width: 120px;
            height: 140px;
            box-sizing: border-box;
            margin: 15px;
            position: relative;
            cursor: pointer;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            border-radius: 20px;
        }

        /* Image styling inside each div */
        .color img {
            opacity: 0;
            visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.5s ease, visibility 0s 0.5s;
        }

        /* Visible image styles */
        .color img.show {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease;
        }

        h2 {
            text-align: center;
            color: rgb(242, 233, 239);
        }

        /* Media queries for responsiveness */
        @media (max-width: 768px) {
            #container {
                width: 80%;
            }
            .color {
                width: 100px;
                height: 120px;
            }
        }

        @media (max-width: 480px) {
            #container {
                width: 100%;
            }
            .color {
                width: 80px;
                height: 100px;
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="m-container">   
        <div id="container">
            <!-- Adding images inside each div with onclick function -->
            <div id="m1" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh.png" alt="Image 1">
            </div>
            <div id="m2" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh2.png" alt="Image 2"> <!-- Different image for the second column -->
            </div>
            <div id="m3" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh.png" alt="Image 3">
            </div>
            <div id="m4" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh2.png" alt="Image 4"> <!-- Different image for the fourth column -->
            </div>
            <div id="m5" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh.png" alt="Image 5">
            </div>
            <div id="m6" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh2.png" alt="Image 6">
            </div>
            <div id="m7" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh.png" alt="Image 7">
            </div>
            <div id="m8" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh2.png" alt="Image 8">
            </div>
            <div id="m9" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh.png" alt="Image 9">
            </div>
            <div id="m10" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh2.png" alt="Image 10">
            </div>
            <div id="m11" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh.png" alt="Image 11">
            </div>
            <div id="m12" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh2.png" alt="Image 12">
            </div>      
            <div id="m13" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh.png" alt="Image 13">
            </div> 
            <div id="m14" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh2.png" alt="Image 14">
            </div> 
            <div id="m15" class="color" onclick="toggleImage(this)"><h2>MOSH</h2>
                <img src="mosh.png" alt="Image 15">
            </div>   
        </div>
        <!-- Adding more flowers around the container -->
        <div class="flower flower1"></div>
        <div class="flower flower2"></div>
        <div class="flower flower3"></div>
        <div class="flower flower4"></div>
        <div class="flower flower5"></div>
        <div class="flower flower6"></div>
        <div class="flower flower7"></div>
        <div class="flower flower8"></div>
    </div>

    <script>
        // Generic function to toggle image visibility inside a div
        function toggleImage(divElement) {
            // Find the image inside the clicked div
            let img = divElement.querySelector('img');

            // Toggle the show class to control opacity and visibility
            if (img.classList.contains('show')) {
                img.classList.remove('show'); // Hide the image
            } else {
                img.classList.add('show'); // Show the image
            }
        }
    </script>
</body>
</html>
