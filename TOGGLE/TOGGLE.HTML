    <style>

       #m-container{
        display: flex;
        justify-content: center;
        align-items: center;
        border: solid black;
        width: 9cm;
        height: 6cm;

    
       }

          .m-container-2{
             border-radius: 50px;
             border: solid;
            
             background: linear-gradient(rgb(255, 255, 255), rgb(244, 108, 189));
             transition: ease 0.5s;
                       

          }

          .m-container-2:hover{   
             background-color: aqua;
          }

          
         



       #btn{
        margin-top: 400px;
         display: flex;    
         position: absolute;  
        justify-content: center;
        width: 100px;
        height: 30px;
        align-items: center;
        border: ridge rgb(255, 0, 208) 1px;
        color: rgb(0, 0, 0);
        background-color: white;
        border-radius: 5px;
        transition: ease-in-out 0.1s;
        
       }

       #btn:hover{
        background-color: rgb(249, 0, 195);
        color: white;
       }


       #label{
         font-family: cursive;
         font-size: large;
         
       }

       .label2{
        color: rgb(255, 0, 166);
       }

      .to-right{
        transform: translateX(150px);
      }
        
    </style>
</head>

        <!--     
         <div id="toggle">HELLO</div>
         <button onclick="showHide()">Click Here</button>
      -->
 
                     
            <div id="m-container">
                <div id="label" onclick="clickHere()">MOSH</div>
            </div>
                    <button onclick="clickHere()" id="btn">CLICK HERE</button>
         
<body id="body"> 
    



    <script>
        /*
         let touchIt = document.getElementById("toggle");


         function showHide(){
           touchIt.classList.toggle('toggle2');
         }
           */
       let newLabel = "KEEP SAFE MOSH!";
      let mainBox = document.getElementById("m-container");
      let mosh = document.getElementById("label");
      let body = document.getElementById("body");
      const button  = document.getElementById("btn")
    
      

      function clickHere(){
          mainBox.classList.toggle('m-container-2');
          mosh.classList.toggle = ('to-right');
          mosh.textContent= newLabel;
          mainBox.style.borderColor = "pink";
          mosh.classList.toggle('label2');
          body.style.backgroundColor = 'rgb(132, 0, 86)';
          button.classList.toggle("to-right");
      }


    </script>
</body>
